# Ограничение действует до передачи тела запроса конвертеру.
limit_req_zone $binary_remote_addr zone=convert_per_ip:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=convert_connections:10m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # В production доверяем только адресу TLS-прокси из отдельной сети.
    include /etc/nginx/trusted-proxy/*.conf;
    client_max_body_size 32m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    error_page 413 = @too_large;
    error_page 429 = @busy;
    location @too_large {
        default_type application/json;
        return 413 '{"detail":"Запрос больше 32 МБ"}';
    }
    location @busy {
        default_type application/json;
        return 429 '{"detail":"Слишком много запросов. Повторите через минуту."}';
    }

    # Docker DNS перечитывается после замены контейнера backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    location = /api/convert/docx {
        limit_req zone=convert_per_ip burst=3 nodelay;
        limit_conn convert_connections 2;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
    }
    location /api/ {
        default_type application/json;
        return 404 '{"detail":"Маршрут не найден"}';
    }
    location = /health {
        proxy_pass $backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        access_log off;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location ~ /\. {
        deny all;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
