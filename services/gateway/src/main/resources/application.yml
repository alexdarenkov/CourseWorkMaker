server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            exposedHeaders:
              - Content-Disposition
      routes:
        - id: auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: documents
          uri: ${DOCUMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/documents/**
        - id: convert
          uri: ${CONVERTER_SERVICE_URL:http://localhost:8001}
          predicates:
            - Path=/api/convert/**
          filters:
            - RewritePath=/api/convert/(?<seg>.*), /convert/$\{seg}
        - id: ai
          uri: ${AI_SERVICE_URL:http://localhost:8002}
          predicates:
            - Path=/api/ai/**
          filters:
            - RewritePath=/api/ai/(?<seg>.*), /$\{seg}
      httpclient:
        response-timeout: 120s

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET}
