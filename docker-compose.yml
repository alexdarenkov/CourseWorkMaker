name: courseworkmaker

services:
  # Единый бэкенд: только конвертация MD→DOCX (аккаунтов и БД нет).
  backend:
    build: services/backend
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      # Наружу нужен только dev-серверу vite (проксирует /api сюда). В проде
      # фронт ходит через nginx той же сети — порт можно закрыть override'ом.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [backend]

  frontend:
    build: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks: [backend]

networks:
  backend:
