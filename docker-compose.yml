name: courseworkmaker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coursework}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coursework}
      POSTGRES_DB: ${POSTGRES_DB:-coursework}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  # Единый монолит: auth + documents + convert (MD→DOCX) + ai (генерация).
  # JWT проверяется здесь же — отдельного gateway больше нет (SEC-1).
  backend:
    build: services/backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-coursework}:${POSTGRES_PASSWORD:-coursework}@postgres:5432/${POSTGRES_DB:-coursework}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://polza.ai/api/v1}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-google/gemini-2.5-flash}
      AI_MODEL_BALANCED: ${AI_MODEL_BALANCED:-openai/gpt-5-mini}
      AI_MODEL_QUALITY: ${AI_MODEL_QUALITY:-anthropic/claude-sonnet-4.6}
    ports:
      # Наружу нужен только dev-серверу vite (проксирует /api сюда). В проде
      # фронт ходит через nginx той же сети — порт можно закрыть override'ом.
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [backend]

  frontend:
    build: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks: [backend]

volumes:
  pgdata:

networks:
  backend:
