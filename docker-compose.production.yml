# Самостоятельный файл: не объединять с dev docker-compose.yml.
name: texturn

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: services/backend
    restart: unless-stopped
    init: true
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging
    networks: [backend]

  frontend:
    build: frontend
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    volumes:
      - ./deploy/trusted-proxy.conf:/etc/nginx/trusted-proxy/caddy.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    networks:
      edge:
        ipv4_address: 172.30.47.3
      backend:

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    environment:
      DOMAIN: ${DOMAIN:?Укажите домен в переменной DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    logging: *logging
    networks:
      edge:
        ipv4_address: 172.30.47.2

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.47.0/24
  backend:

volumes:
  caddy_data:
  caddy_config:
